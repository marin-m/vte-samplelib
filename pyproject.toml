
[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "vmlinux-to-elf-samplelib"
version = "1.0"
dependencies = [
    "lz4>=4.4.5",
    "zstandard>=0.25.0",
    "minilzo>=1.2",
    "peewee",
    "gitpython>=3.1.46",
    "protobuf>=6.33.5",
    "peewee-enum-field>=0.2.0",
]
requires-python = ">=3.11" # tomllib was added in Python 3.11
authors = [{ name = "Marin Moulinier" }]
description = "Additional package to vmlinux-to-elf to sort out available kernel samples, provide CI/CD, generate kernel blobs with and without symbols from scratch"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.uv.build-backend]
module-name = "vte_samplelib"
module-root = ""

[project.urls]
Homepage = "https://github.com/marin-m/vte-samplelib"

[project.scripts]
samplelib-show-db = "vte_samplelib.scripts.show_db:main"
samplelib-show-config = "vte_samplelib.scripts.show_config:main"
samplelib-extract-info = "vte_samplelib.scripts.extract_kernel_info:main"
